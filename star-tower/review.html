function sky(full=false){return `&lt;svg class=&quot;final-map&quot; viewBox=&quot;0 0 100 100&quot; aria-label=&quot;${full?&#x27;Карта-образец&#x27;:&#x27;Неполное созвездие&#x27;}&quot;&gt;${pts.slice(1).map((b,i)=&gt;full||i&lt;2?`&lt;line x1=&quot;${pts[i][0]}&quot; y1=&quot;${pts[i][1]}&quot; x2=&quot;${b[0]}&quot; y2=&quot;${b[1]}&quot;/&gt;`:&#x27;&#x27;).join(&#x27;&#x27;)}${pts.filter((p,i)=&gt;full||i!==3).map(([x,y])=&gt;`&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;3&quot;/&gt;`).join(&#x27;&#x27;)}${!full?&#x27;&lt;rect x=&quot;52&quot; y=&quot;34&quot; width=&quot;38&quot; height=&quot;42&quot; rx=&quot;4&quot; stroke-dasharray=&quot;3 2&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;58&quot;&gt;?&lt;/text&gt;&#x27;:&#x27;&#x27;}&lt;/svg&gt;`;}
function fragment(i){const lines=[&#x27;10,15 50,85 90,15&#x27;,&#x27;10,85 50,15 90,85&#x27;,&#x27;10,50 50,50 90,50&#x27;,&#x27;10,15 35,85 65,15 90,85&#x27;];return `&lt;svg class=&quot;fragment&quot; viewBox=&quot;0 0 100 100&quot; aria-label=&quot;Вариант фрагмента ${i+1}&quot;&gt;&lt;polyline points=&quot;${lines[i]}&quot;/&gt;${lines[i].split(&#x27; &#x27;).map(a=&gt;`&lt;circle cx=&quot;${a.split(&#x27;,&#x27;)[0]}&quot; cy=&quot;${a.split(&#x27;,&#x27;)[1]}&quot; r=&quot;5&quot;/&gt;`).join(&#x27;&#x27;)}&lt;/svg&gt;`;}
register(7,{title:&#x27;Зажги Звёздную башню&#x27;,instruction:&#x27;Заполни три золотые ячейки: продолжи ряд, реши пример и восстанови фрагмент созвездия.&#x27;,pose:&#x27;lumi-happy&#x27;,mount(c){
let solved=Array.isArray(c.data.solved)?c.data.solved:[],timer;
function answer(part,ok,el){if(solved.includes(part)||c.isDone())return;if(!ok){c.wrong(el);return;}solved.push(part);c.data={solved};document.getElementById(&quot;feedback&quot;).textContent=&quot;Ячейка зажглась!&quot;;c.chime();draw();if(solved.length===3){c.root.classList.add(&#x27;mechanism-on&#x27;);document.querySelector(&#x27;.shell&#x27;).classList.add(&#x27;tower-lit&#x27;);timer=setTimeout(c.success,1600);}}
function draw(){const part=[1,2,3].find(n=&gt;!solved.includes(n));c.root.innerHTML=`&lt;div class=&quot;mechanism-layout&quot;&gt;&lt;div class=&quot;challenge parchment&quot;&gt;${!part?&#x27;&lt;h2&gt;Механизм оживает!&lt;/h2&gt;&lt;p&gt;Свет возвращается в башню…&lt;/p&gt;&#x27;:`&lt;p class=&quot;part-label&quot;&gt;Ячейка ${part} из 3&lt;/p&gt;${part===1?`&lt;h2&gt;Что будет дальше?&lt;/h2&gt;&lt;p class=&quot;pattern-explain&quot;&gt;Какую фигуру поставить вместо «?»?&lt;br&gt;Смотри на &lt;strong&gt;форму и цвет&lt;/strong&gt;.&lt;/p&gt;&lt;div class=&quot;dual-sequence&quot;&gt;${[[&#x27;triangle&#x27;,&#x27;purple&#x27;],[&#x27;circle&#x27;,&#x27;blue&#x27;],[&#x27;square&#x27;,&#x27;purple&#x27;],[&#x27;triangle&#x27;,&#x27;blue&#x27;],[&#x27;circle&#x27;,&#x27;purple&#x27;],[&#x27;square&#x27;,&#x27;blue&#x27;]].map(([s,col])=&gt;`&lt;span class=&quot;sequence-step&quot;&gt;${shape(s,col)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;span class=&quot;sequence-step missing-step&quot; aria-label=&quot;Какой фигуры не хватает?&quot;&gt;?&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;choose-caption&quot;&gt;Выбери одну фигуру внизу&lt;/p&gt;&lt;div class=&quot;answers pattern-answers&quot;&gt;${[[&#x27;triangle&#x27;,&#x27;blue&#x27;],[&#x27;square&#x27;,&#x27;purple&#x27;],[&#x27;triangle&#x27;,&#x27;purple&#x27;],[&#x27;circle&#x27;,&#x27;blue&#x27;]].map(([s,col],i)=&gt;`&lt;button class=&quot;choice&quot; data-pattern=&quot;${i}&quot; aria-label=&quot;${col===&#x27;blue&#x27;?&#x27;Голубой&#x27;:&#x27;Фиолетовый&#x27;} ${s===&#x27;triangle&#x27;?&#x27;треугольник&#x27;:s===&#x27;square&#x27;?&#x27;квадрат&#x27;:&#x27;круг&#x27;}&quot;&gt;${shape(s,col)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:part===2?`&lt;h2&gt;Реши пример&lt;/h2&gt;&lt;p class=&quot;equation&quot;&gt;9 − 4 = ?&lt;/p&gt;&lt;div class=&quot;answers&quot;&gt;${[4,6,5,3].map(n=&gt;`&lt;button class=&quot;choice number&quot; data-number=&quot;${n}&quot;&gt;${n}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:`&lt;h2&gt;Верни фрагмент карты&lt;/h2&gt;&lt;div class=&quot;map-model&quot;&gt;&lt;span&gt;Карта-образец&lt;/span&gt;${sky(true)}&lt;/div&gt;&lt;p&gt;Какой фрагмент восстановит рисунок по образцу?&lt;/p&gt;&lt;div class=&quot;missing-map&quot;&gt;${sky(false)}&lt;/div&gt;&lt;div class=&quot;answers fragment-answers&quot;&gt;${[1,0,3,2].map(i=&gt;`&lt;button class=&quot;choice&quot; data-fragment=&quot;${i}&quot; aria-label=&quot;Фрагмент ${i+1}&quot;&gt;${fragment(i)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}`}&lt;/div&gt;&lt;div class=&quot;mechanism&quot;&gt;&lt;img class=&quot;mechanism-art&quot; src=&quot;assets/star-mechanism.png&quot; alt=&quot;Волшебный звёздный механизм&quot;&gt;&lt;div class=&quot;gold-cells&quot;&gt;${[1,2,3].map(n=&gt;`&lt;div class=&quot;gold-cell ${solved.includes(n)?&#x27;lit&#x27;:&#x27;&#x27;}&quot; aria-label=&quot;Ячейка ${n}: ${solved.includes(n)?&#x27;горит&#x27;:&#x27;не горит&#x27;}&quot;&gt;${solved.includes(n)?c.img(&#x27;star-gold&#x27;):n}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${c.img(&#x27;telescope&#x27;,&#x27;telescope-art&#x27;,&#x27;Волшебный телескоп&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
c.root.querySelectorAll(&#x27;[data-pattern]&#x27;).forEach(b=&gt;b.onclick=()=&gt;answer(1,b.dataset.pattern===&#x27;2&#x27;,b));c.root.querySelectorAll(&#x27;[data-number]&#x27;).forEach(b=&gt;b.onclick=()=&gt;answer(2,b.dataset.number===&#x27;5&#x27;,b));c.root.querySelectorAll(&#x27;[data-fragment]&#x27;).forEach(b=&gt;b.onclick=()=&gt;answer(3,b.dataset.fragment===&#x27;0&#x27;,b));}
draw();if(solved.length===3&amp;&amp;!c.isDone()){c.root.classList.add(&#x27;mechanism-on&#x27;);timer=setTimeout(c.success,1000);}return()=&gt;clearTimeout(timer);
}});
})();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;
