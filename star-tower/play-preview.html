c.root.innerHTML=`<div class="lamp-scene"><div class="lamp-wrap">${c.img('lamp','lamp-art','Волшебная лампа')}<div class="inside-sparks"></div><span class="lamp-goal">8</span></div><div class="spark-tray">${Array.from({length:9},(_,i)=>`<button class="spark-source" data-spark="${i}" aria-label="Добавить искру ${i+1}">${c.img('spark')}</button>`).join('')}</div></div>`;
function update(){c.root.querySelector('.inside-sparks').innerHTML=Array.from({length:3+used.length},(_,i)=>c.img('spark','inside-spark')).join('');c.root.querySelectorAll('[data-spark]').forEach(b=>{b.disabled=used.includes(Number(b.dataset.spark));b.classList.toggle('used',b.disabled);});c.root.querySelector('.lamp-wrap').classList.toggle('lamp-lit',used.length===5);}
c.root.querySelectorAll('[data-spark]').forEach(b=>b.onclick=()=>{if(busy||c.isDone()||b.disabled)return;if(used.length>=5)return;busy=true;const target=c.root.querySelector('.inside-sparks'),r=b.getBoundingClientRect(),t=target.getBoundingClientRect(),fly=document.createElement('img');fly.src='assets/spark.png';fly.className='flying-spark';fly.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;--dx:${t.left+t.width/2-r.left-r.width/2}px;--dy:${t.top+t.height/2-r.top-r.height/2}px`;document.body.append(fly);b.disabled=true;timer=setTimeout(()=>{fly.remove();used.push(Number(b.dataset.spark));c.data={used};busy=false;update();if(used.length===5){c.root.classList.add('workshop-lit');timer=setTimeout(c.success,800);}},650);});update();if(used.length===5&&!c.isDone())timer=setTimeout(c.success,800);return()=>{clearTimeout(timer);document.querySelectorAll('.flying-spark').forEach(x=>x.remove());};
}});
})();
</script><script>(() => {
const {register}=window.Lumi;
register(5,{title:'Часы звёздного времени',instruction:'Расставь картинки по порядку: от вечера до утра. Нажимай на картинки или переноси их в окошки.',pose:'lumi-thinking',mount(c){
const cards=[{id:'night',name:'Ночь'},{id:'morning',name:'Утро'},{id:'sunset',name:'Вечерний закат'},{id:'predawn',name:'Предрассветное небо'}];let order=Array.isArray(c.data.order)?c.data.order:[null,null,null,null],dragging=null;
c.root.innerHTML=`<div class="time-decor">${c.img('time-clock','clock-art')}</div><div class="time-source"></div><div class="time-slots"></div><div class="controls"><button id="check-time" class="gold">Проверить порядок</button></div><p class="caption">Чтобы поменять картинку, нажми на неё в окошке.</p>`;
function put(id,slot){const prev=order.indexOf(id);if(prev>=0)order[prev]=null;order[slot]=id;c.data={order};draw();}
function draw(){c.root.querySelector('.time-source').innerHTML=cards.map(a=>`<button class="time-card" data-card="${a.id}" aria-label="${a.name}" ${order.includes(a.id)?'disabled':''}>${c.img(a.id,'',a.name)}</button>`).join('');c.root.querySelector('.time-slots').innerHTML=order.map((id,i)=>`<button class="time-slot ${id?'filled':''}" data-slot="${i}" aria-label="Место ${i+1}${id?', '+cards.find(x=>x.id===id).name:''}">${id?c.img(id):'<span>?</span>'}<b>${i+1}</b></button>`).join('');c.root.querySelectorAll('[data-card]').forEach(b=>{b.onclick=()=>{const s=order.indexOf(null);if(s>=0)put(b.dataset.card,s);};b.onpointerdown=e=>{dragging=b.dataset.card;};});c.root.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.slot);if(order[i]){order[i]=null;c.data={order};draw();}});}
const onUp=e=>{if(!dragging)return;const slot=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');if(slot){put(dragging,Number(slot.dataset.slot));e.preventDefault();}dragging=null;};document.addEventListener('pointerup',onUp);c.root.querySelector('#check-time').onclick=e=>{if(order.join(',')==='sunset,night,predawn,morning')c.success();else c.wrong(e.currentTarget);};draw();return()=>document.removeEventListener('pointerup',onUp);
}});
register(6,{title:'Собери силуэт',instruction:'Собери ракету из двух деталей. Выбери деталь и нажми на её место в силуэте или перенеси её пальцем.',pose:'lumi-thinking',mount(c){
const pieces=[{id:'rocket-body',name:'Корпус ракеты',w:70,h:70,x:50,y:40},{id:'planet',name:'Планета с кольцами',w:44,h:35},{id:'crystal',name:'Кристалл',w:30,h:43},{id:'rocket-flame',name:'Огонь двигателя',w:30,h:30,x:50,y:80}];let placements=c.data.placements||{},selected=null,dragging=null;
c.root.innerHTML=`<div class="puzzle-layout"><div class="assembly" tabindex="0" aria-label="Поле сборки ракеты">${pieces.filter(p=>p.x).map(p=>`<img src="assets/${p.id}.png" class="silhouette" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%" alt="">`).join('')}<div id="placed-pieces"></div></div><div class="piece-tray">${pieces.map(p=>`<button class="choice puzzle-piece" data-piece="${p.id}" aria-label="Выбрать: ${p.name}">${c.img(p.id)}</button>`).join('')}</div></div><p id="puzzle-tip" class="caption">Выбери деталь справа, затем нажми на её место.</p><div class="controls"><button id="check-puzzle" class="gold">Проверить силуэт</button><button id="clear-puzzle" class="secondary">Убрать детали</button></div>`;
const assembly=c.root.querySelector('.assembly');
function draw(){c.root.querySelector('#placed-pieces').innerHTML=Object.entries(placements).map(([id,pos])=>{const p=pieces.find(p=>p.id===id);return p?`<img src="assets/${id}.png" class="placed-piece" data-placed="${id}" style="left:${pos.x}%;top:${pos.y}%;width:${p.w}%;height:${p.h}%" alt="${p.name}">`:'';}).join('');c.root.querySelectorAll('[data-piece]').forEach(b=>b.classList.toggle('selected',b.dataset.piece===selected));}
function drop(id,e){const r=assembly.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x<0||x>100||y<0||y>100)return;const p=pieces.find(p=>p.id===id);if(p.x&&Math.abs(x-p.x)<13&&Math.abs(y-p.y)<15){x=p.x;y=p.y;}placements[id]={x,y};selected=null;c.data={placements};draw();c.root.querySelector('#puzzle-tip').textContent='Можно двигать детали. Когда ракета готова, нажми «Проверить силуэт».';}
c.root.querySelectorAll('[data-piece]').forEach(b=>{b.onpointerdown=e=>{selected=b.dataset.piece;dragging=selected;draw();c.root.querySelector('#puzzle-tip').textContent='Теперь нажми на нужное место в силуэте.';};b.onclick=()=>{selected=b.dataset.piece;draw();};});assembly.onpointerdown=e=>{const p=e.target.closest('[data-placed]');if(selected)drop(selected,e);else if(p){dragging=p.dataset.placed;selected=dragging;}};
const onUp=e=>{if(dragging){drop(dragging,e);dragging=null;}};const onMove=e=>{if(dragging&&e.pointerType==='touch')e.preventDefault();};document.addEventListener('pointerup',onUp);document.addEventListener('pointermove',onMove,{passive:false});
c.root.querySelector('#clear-puzzle').onclick=()=>{placements={};selected=null;c.data={placements};draw();};c.root.querySelector('#check-puzzle').onclick=e=>{const ids=Object.keys(placements);const correct=ids.length===2&&['rocket-body','rocket-flame'].every(id=>{const p=pieces.find(p=>p.id===id),q=placements[id];return q&&Math.abs(p.x-q.x)<=7&&Math.abs(p.y-q.y)<=8;});if(correct){assembly.classList.add('assembled');c.success();}else c.wrong(e.currentTarget);};draw();return()=>{document.removeEventListener('pointerup',onUp);document.removeEventListener('pointermove',onMove);};
}});
})();
</script><script>(() => {
const {register,shape}=window.Lumi;
const pts=[[12,52],[32,22],[53,38],[69,70],[86,38]];
function sky(full=false){return `<svg class="final-map" viewBox="0 0 100 100" aria-label="${full?'Карта-образец':'Неполное созвездие'}">${pts.slice(1).map((b,i)=>full||i<2?`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${b[0]}" y2="${b[1]}"/>`:'').join('')}${pts.filter((p,i)=>full||i!==3).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3"/>`).join('')}${!full?'<rect x="52" y="34" width="38" height="42" rx="4" stroke-dasharray="3 2" fill="none"/><text x="70" y="58">?</text>':''}</svg>`;}
function fragment(i){const lines=['10,15 50,85 90,15','10,85 50,15 90,85','10,50 50,50 90,50','10,15 35,85 65,15 90,85'];return `<svg class="fragment" viewBox="0 0 100 100" aria-label="Вариант фрагмента ${i+1}"><polyline points="${lines[i]}"/>${lines[i].split(' ').map(a=>`<circle cx="${a.split(',')[0]}" cy="${a.split(',')[1]}" r="5"/>`).join('')}</svg>`;}
register(7,{title:'Зажги Звёздную башню',instruction:'Заполни три золотые ячейки: продолжи ряд, реши пример и восстанови фрагмент созвездия.',pose:'lumi-happy',mount(c){
let solved=Array.isArray(c.data.solved)?c.data.solved:[],timer;
function answer(part,ok,el){if(solved.includes(part)||c.isDone())return;if(!ok){c.wrong(el);return;}solved.push(part);c.data={solved};document.getElementById("feedback").textContent="Ячейка зажглась!";c.chime();draw();if(solved.length===3){c.root.classList.add('mechanism-on');document.querySelector('.shell').classList.add('tower-lit');timer=setTimeout(c.success,1600);}}
function draw(){const part=[1,2,3].find(n=>!solved.includes(n));c.root.innerHTML=`<div class="mechanism-layout"><div class="challenge parchment">${!part?'<h2>Механизм оживает!</h2><p>Свет возвращается в башню…</p>':`<p class="part-label">Ячейка ${part} из 3</p>${part===1?`<h2>Что будет дальше?</h2><p class="pattern-explain">Продолжи ряд слева направо.<br>Учитывай <strong>форму и цвет</strong>.</p><div class="dual-sequence">${[['triangle','purple'],['circle','blue'],['square','purple'],['triangle','blue'],['circle','purple'],['square','blue']].map(([s,col])=>`<span class="sequence-step">${shape(s,col)}</span>`).join('')}<span class="sequence-step missing-step" aria-label="Какой фигуры не хватает?">?</span></div><p class="choose-caption">Выбери одну фигуру внизу</p><div class="answers pattern-answers">${[['triangle','blue'],['square','purple'],['triangle','purple'],['circle','blue']].map(([s,col],i)=>`<button class="choice" data-pattern="${i}" aria-label="${col==='blue'?'Голубой':'Фиолетовый'} ${s==='triangle'?'треугольник':s==='square'?'квадрат':'круг'}">${shape(s,col)}</button>`).join('')}</div>`:part===2?`<h2>Реши пример</h2><p class="equation">9 − 4 = ?</p><div class="answers">${[4,6,5,3].map(n=>`<button class="choice number" data-number="${n}">${n}</button>`).join('')}</div>`:`<h2>Верни фрагмент карты</h2><div class="map-model"><span>Карта-образец</span>${sky(true)}</div><p>Какой фрагмент восстановит рисунок по образцу?</p><div class="missing-map">${sky(false)}</div><div class="answers fragment-answers">${[1,0,3,2].map(i=>`<button class="choice" data-fragment="${i}" aria-label="Фрагмент ${i+1}">${fragment(i)}</button>`).join('')}</div>`}`}</div><div class="mechanism"><img class="mechanism-art" src="assets/star-mechanism.png" alt="Волшебный звёздный механизм"><div class="gold-cells">${[1,2,3].map(n=>`<div class="gold-cell ${solved.includes(n)?'lit':''}" aria-label="Ячейка ${n}: ${solved.includes(n)?'горит':'не горит'}">${solved.includes(n)?c.img('star-gold'):n}</div>`).join('')}</div>${c.img('telescope','telescope-art','Волшебный телескоп')}</div></div>`;
c.root.querySelectorAll('[data-pattern]').forEach(b=>b.onclick=()=>answer(1,b.dataset.pattern==='2',b));c.root.querySelectorAll('[data-number]').forEach(b=>b.onclick=()=>answer(2,b.dataset.number==='5',b));c.root.querySelectorAll('[data-fragment]').forEach(b=>b.onclick=()=>answer(3,b.dataset.fragment==='0',b));}
draw();if(solved.length===3&&!c.isDone()){c.root.classList.add('mechanism-on');timer=setTimeout(c.success,1000);}return()=>clearTimeout(timer);
}});
})();
</script></body></html>
