}.qa-mode .qa{display:flex}.qa-mode header{flex-wrap:wrap}</style></head><body><header><span>Луми · три волшебных приключения</span><div class="qa"><button data-width="375">375 px</button><button data-width="768">768 px</button><button data-width="1024">1024 px</button><button data-width="1366">1366 px</button></div><button id="back">Все приключения</button></header><main class="gallery"><h1>Выбери своё приключение</h1><p>Обновлённое оформление, знакомые задания и подсказки от Луми.</p><div class="cards"><article class="card"><img src="https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/images/crystal-trail-bg.png" alt="Секрет Кристальной тропы"><h2>Секрет Кристальной тропы</h2><p>3–4 года · 7 заданий</p><button data-page="crystal-trail.html">Начать · 3–4 года</button></article><article class="card"><img src="https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/adventure-art/lighthouse-coast.png" alt="Тайна Кристального маяка"><h2>Тайна Кристального маяка</h2><p>4–5 лет · 7 заданий</p><button data-page="crystal-lighthouse/index.html">Начать · 4–5 лет</button></article><article class="card"><img src="https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/star-tower/assets/tower-night.png" alt="Луми и Тайна Звёздной башни"><h2>Луми и Тайна Звёздной башни</h2><p>5–6 лет · 7 заданий</p><button data-page="star-tower/index.html">Начать · 5–6 лет</button></article></div></main><div id="holder" class="frame-holder" hidden><iframe title="Приключение Луми"></iframe></div><script id="sources" type="application/json">{"pages": {"crystal-trail-7.html": {"base": "https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/", "attrs": " class=\"crystal-game-page lumi-trail\" data-adventure=\"trail\" data-step=\"7\"", "body": "\n\n\n<main class=\"crystal-game-screen final-page-screen\">\n\n\n    \n\n    <div class=\"crystal-game-top\">\n\n\n        <a\n            href=\"crystal-trail-6.html\"\n            class=\"crystal-game-back\"\n        >\n            ← Назад\n        <\/a>\n\n\n        <div class=\"crystal-game-number\">\n            7 из 7\n        <\/div>\n\n\n        <div class=\"crystal-game-progress\">\n\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n\n            <span class=\"current\"><\/span>\n\n        <\/div>\n\n\n    <\/div>\n\n\n\n    \n\n    <div class=\"crystal-game-title final-title\">\n\n        <span>\n            Последнее испытание\n        <\/span>\n\n        <h1>\n            Открой волшебную дверь ✦\n        <\/h1>\n\n        <p>\n            Найди ключ, который подходит сразу по двум признакам.\n        <\/p>\n\n    <\/div>\n\n\n\n    \n\n    <section class=\"final-game-area\">\n\n\n        \n\n        <div class=\"final-lumi\">\n\n            <img\n                src=\"star-tower/assets/lumi-happy.png\"\n                alt=\"Луми\"\n            >\n\n        <\/div>\n\n\n\n        \n\n        <div class=\"final-stage\">\n\n\n            \n\n            <div class=\"door-area\">\n\n\n                <img\n                    src=\"images/magic-door.png\"\n                    alt=\"Волшебная дверь\"\n                    class=\"magic-door\"\n                    id=\"magicDoor\"\n                >\n\n\n\n                \n\n                <div class=\"key-rule\">\n\n\n                    \n\n                    <div class=\"rule-symbol-box\">\n\n                        <div\n                            class=\"key-ring-symbol\"\n                        ><\/div>\n\n                    <\/div>\n\n\n\n                    \n\n                    <div class=\"rule-plus\">\n                        +\n                    <\/div>\n\n\n\n                    \n\n                    <div class=\"rule-symbol-box\">\n\n                        <div\n                            class=\"key-star-symbol\"\n                        >\n                            ★\n                        <\/div>\n\n                    <\/div>\n\n\n                <\/div>\n\n\n\n                \n\n                <div\n                    class=\"door-key-slot\"\n                    id=\"doorKeySlot\"\n                ><\/div>\n\n\n            <\/div>\n\n\n\n            \n\n            <div\n                class=\"final-message\"\n                id=\"finalMessage\"\n            >\n                Какой ключ подойдёт?\n            <\/div>\n\n\n\n            \n\n            <div class=\"key-options\">\n\n\n                \n\n                <button\n                    class=\"key-option\"\n                    data-answer=\"correct\"\n                >\n\n                    <img\n                        src=\"images/key-round-star.png\"\n                        alt=\"Ключ с круглым ободком и звездой\"\n                    >\n\n                <\/button>\n\n\n\n                \n\n                <button\n                    class=\"key-option\"\n                    data-answer=\"wrong\"\n                >\n\n                    <img\n                        src=\"images/key-round-moon.png\"\n                        alt=\"Ключ\"\n                    >\n\n                <\/button>\n\n\n\n                \n\n                <button\n                    class=\"key-option\"\n                    data-answer=\"wrong\"\n                >\n\n                    <img\n                        src=\"images/key-angular-star.png\"\n                        alt=\"Ключ\"\n                    >\n\n                <\/button>\n\n\n\n                \n\n                <button\n                    class=\"key-option\"\n                    data-answer=\"wrong\"\n                >\n\n                    <img\n                        src=\"images/key-angular-moon.png\"\n                        alt=\"Ключ\"\n                    >\n\n                <\/button>\n\n\n            <\/div>\n\n\n\n            \n\n            <div\n                class=\"final-reward-area\"\n                id=\"finalRewardArea\"\n            >\n\n                <div class=\"final-reward-text\">\n                    ✦ Дверь открыта!\n                <\/div>\n\n\n                <button\n                    class=\"final-reward-button\"\n                    id=\"rewardButton\"\n                >\n                    Получить Кристалл открытий ✦\n                <\/button>\n\n            <\/div>\n\n\n        <\/div>\n\n\n    <\/section>\n\n\n<\/main>\n\n\n\n<script>\n\n    /* ==========================================\n       ЭЛЕМЕНТЫ\n    ========================================== */\n\n    const keys =\n        document.querySelectorAll(\n            \".key-option\"\n        );\n\n\n    const door =\n        document.getElementById(\n            \"magicDoor\"\n        );\n\n\n    const keySlot =\n        document.getElementById(\n            \"doorKeySlot\"\n        );\n\n\n    const message =\n        document.getElementById(\n            \"finalMessage\"\n        );\n\n\n    const rewardArea =\n        document.getElementById(\n            \"finalRewardArea\"\n        );\n\n\n    const rewardButton =\n        document.getElementById(\n            \"rewardButton\"\n        );\n\n\n    const progressCurrent =\n        document.querySelector(\n            \".crystal-game-progress .current\"\n        );\n\n\n    let taskFinished = false;\n\n\n\n    /* ==========================================\n       НАЖАТИЕ НА КЛЮЧ\n    ========================================== */\n\n    keys.forEach(key => {\n\n        key.addEventListener(\n            \"click\",\n            () => {\n\n\n                if (taskFinished) {\n                    return;\n                }\n\n\n\n                /* ==============================\n                   ПРАВИЛЬНЫЙ КЛЮЧ\n                ============================== */\n\n                if (\n                    key.dataset.answer\n                    === \"correct\"\n                ) {\n\n                    taskFinished = true;\n\n\n\n                    /* Блокируем ключи */\n\n                    keys.forEach(item => {\n\n                        item.disabled = true;\n\n                    });\n\n\n\n                    /* Подсвечиваем выбранный */\n\n                    key.classList.add(\n                        \"correct\"\n                    );\n\n\n\n                    /* Показываем ключ у двери */\n\n                    keySlot.innerHTML = `\n                        <img\n                            src=\"images/key-round-star.png\"\n                            alt=\"\"\n                        >\n                    `;\n\n\n                    keySlot.classList.add(\n                        \"show\"\n                    );\n\n\n\n                    /* Дверь начинает светиться */\n\n                    door.classList.add(\n                        \"open\"\n                    );\n\n\n\n                    /* Меняем текст */\n\n                    message.textContent =\n                        \"Ключ подошёл! ✦\";\n\n\n\n                    /* Завершаем прогресс */\n\n                    if (progressCurrent) {\n\n                        progressCurrent\n                            .classList\n                            .remove(\"current\");\n\n                        progressCurrent\n                            .classList\n                            .add(\"completed\");\n\n                    }\n\n\n\n                    /* ПОКАЗЫВАЕМ КНОПКУ */\n\n                    setTimeout(() => {\n\n                        rewardArea\n                            .classList\n                            .add(\"show\");\n\n                    }, 650);\n\n\n                    return;\n\n                }\n\n\n\n                /* ==============================\n                   НЕПРАВИЛЬНЫЙ КЛЮЧ\n                ============================== */\n\n                key.classList.remove(\n                    \"wrong\"\n                );\n\n\n                void key.offsetWidth;\n\n\n                key.classList.add(\n                    \"wrong\"\n                );\n\n\n                message.textContent =\n                    \"Посмотри ещё раз ✦\";\n\n            }\n        );\n\n    });\n\n\n\n    /* ==========================================\n       ПЕРЕХОД НА ЭКРАН НАГРАДЫ\n    ========================================== */\n\n    rewardButton.addEventListener(\n        \"click\",\n        () => {\n\n            parent.postMessage({type:'lumi-review',page:\"crystal-trail-reward.html\"},'*');\n\n        }\n    );\n\n<\/script>\n\n\n", "styles": ["style.css", "adventure-art/illustrated.css", "crystal-trail-7.html:inline0"], "scripts": ["help", "nav"]}, "crystal-trail-4.html": {"base": "https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/", "attrs": " class=\"crystal-game-page lumi-trail\" data-adventure=\"trail\" data-step=\"4\"", "body": "\n\n\n<main class=\"crystal-game-screen firefly-page-screen\">\n\n\n    \n\n    <div class=\"crystal-game-top\">\n\n        <a\n            href=\"crystal-trail-3.html\"\n            class=\"crystal-game-back\"\n        >\n            ← Назад\n        <\/a>\n\n\n        <div class=\"crystal-game-number\">\n            4 из 7\n        <\/div>\n\n\n        <div class=\"crystal-game-progress\">\n\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n\n            <span class=\"current\"><\/span>\n\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n\n        <\/div>\n\n    <\/div>\n\n\n\n    \n\n    <div class=\"crystal-game-title firefly-title\">\n\n        <span>\n            Четвёртое испытание\n        <\/span>\n\n        <h1>\n            Угости светлячка ✦\n        <\/h1>\n\n        <p>\n            Посчитай огоньки и выбери столько же ягод.\n        <\/p>\n\n    <\/div>\n\n\n\n    \n\n    <section class=\"firefly-game-area\">\n\n\n        \n\n        <div class=\"firefly-lumi\">\n\n            <img\n                src=\"star-tower/assets/lumi-happy.png\"\n                alt=\"Луми\"\n            >\n\n        <\/div>\n\n\n\n        \n\n        <div class=\"firefly-stage\">\n\n\n            \n\n            <div class=\"firefly-character\">\n\n                <img\n                    src=\"images/firefly.png\"\n                    alt=\"Светлячок\"\n                    id=\"fireflyImage\"\n                >\n\n\n                \n\n                <div class=\"magic-lights\">\n\n                    <span><\/span>\n                    <span><\/span>\n                    <span><\/span>\n                    <span><\/span>\n\n                <\/div>\n\n            <\/div>\n\n\n\n            \n\n            <div class=\"firefly-instruction\">\n\n                <strong>\n                    Сколько огоньков сияет рядом?\n                <\/strong>\n\n                <p>\n                    Выбери столько же ягод.\n                <\/p>\n\n            <\/div>\n\n\n\n            \n\n            <div\n                class=\"chosen-berries\"\n                id=\"chosenBerries\"\n            >\n            <\/div>\n\n\n\n            \n\n            <div class=\"berry-options\">\n\n                <button class=\"berry-option\">\n                    <img src=\"images/berry.png\" alt=\"Ягода\">\n                <\/button>\n\n                <button class=\"berry-option\">\n                    <img src=\"images/berry.png\" alt=\"Ягода\">\n                <\/button>\n\n                <button class=\"berry-option\">\n                    <img src=\"images/berry.png\" alt=\"Ягода\">\n                <\/button>\n\n                <button class=\"berry-option\">\n                    <img src=\"images/berry.png\" alt=\"Ягода\">\n                <\/button>\n\n                <button class=\"berry-option\">\n                    <img src=\"images/berry.png\" alt=\"Ягода\">\n                <\/button>\n\n                <button class=\"berry-option\">\n                    <img src=\"images/berry.png\" alt=\"Ягода\">\n                <\/button>\n\n            <\/div>\n\n\n\n            \n\n            <button\n                class=\"firefly-check-button\"\n                id=\"fireflyCheckButton\"\n            >\n                Далее →\n            <\/button>\n\n\n\n            \n\n            <div\n                class=\"firefly-answer-message\"\n                id=\"fireflyAnswerMessage\"\n            >\n                Попробуй ещё ✦\n            <\/div>\n\n\n        <\/div>\n\n\n    <\/section>\n\n\n\n    \n\n    <div\n        class=\"crystal-success\"\n        id=\"fireflySuccess\"\n    >\n\n        <div class=\"crystal-success-message\">\n\n            <span>✦<\/span>\n\n            <div>\n\n                <strong>\n                    Правильно!\n                <\/strong>\n\n                <p>\n                    Четыре огонька — четыре ягодки.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n\n<\/main>\n\n\n\n<script>\n\nconst berries =\n    document.querySelectorAll(\".berry-option\");\n\nconst chosenBerries =\n    document.getElementById(\"chosenBerries\");\n\nconst checkButton =\n    document.getElementById(\"fireflyCheckButton\");\n\nconst answerMessage =\n    document.getElementById(\"fireflyAnswerMessage\");\n\nconst firefly =\n    document.getElementById(\"fireflyImage\");\n\nconst success =\n    document.getElementById(\"fireflySuccess\");\n\nconst progress =\n    document.querySelector(\n        \".crystal-game-progress .current\"\n    );\n\n\nlet selectedBerries = [];\n\n\n\n/* ============================\n   ПОКАЗЫВАЕМ ВЫБРАННЫЕ ЯГОДЫ\n============================ */\n\nfunction updateChosenBerries() {\n\n    chosenBerries.innerHTML = \"\";\n\n\n    selectedBerries.forEach(() => {\n\n        const img =\n            document.createElement(\"img\");\n\n        img.src =\n            \"images/berry.png\";\n\n        img.alt = \"\";\n\n        chosenBerries.appendChild(img);\n\n    });\n\n\n    /* Кнопка появляется после первого выбора */\n\n    if (selectedBerries.length > 0) {\n\n        checkButton.classList.add(\"show\");\n\n    }\n\n    else {\n\n        checkButton.classList.remove(\"show\");\n\n    }\n\n}\n\n\n\n/* ============================\n   ВЫБОР ЯГОД\n============================ */\n\nberries.forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n\n        /* УБИРАЕМ ЯГОДУ */\n\n        if (button.classList.contains(\"selected\")) {\n\n            button.classList.remove(\"selected\");\n\n\n            selectedBerries =\n                selectedBerries.filter(\n                    berry => berry !== button\n                );\n\n\n            updateChosenBerries();\n\n            return;\n        }\n\n\n\n        /* ДОБАВЛЯЕМ ЯГОДУ */\n\n        button.classList.add(\"selected\");\n\n        selectedBerries.push(button);\n\n        updateChosenBerries();\n\n\n\n        /* Убираем старую ошибку */\n\n        answerMessage.classList.remove(\"show\");\n\n    });\n\n});\n\n\n\n/* ============================\n   КНОПКА ДАЛЕЕ\n============================ */\n\ncheckButton.addEventListener(\"click\", () => {\n\n\n    /* ПРАВИЛЬНО */\n\n    if (selectedBerries.length === 4) {\n\n    parent.postMessage({type:'lumi-review',page:\"crystal-trail-5.html\"},'*');\n\n    return;\n\n}\n   \n\n\n\n    /* НЕПРАВИЛЬНО */\n\n    answerMessage.classList.remove(\"show\");\n\n\n    void answerMessage.offsetWidth;\n\n\n    answerMessage.classList.add(\"show\");\n\n\n    checkButton.classList.remove(\"wrong\");\n\n\n    void checkButton.offsetWidth;\n\n\n    checkButton.classList.add(\"wrong\");\n\n});\n\n<\/script>\n\n\n", "styles": ["style.css", "adventure-art/illustrated.css"], "scripts": ["help", "nav"]}, "crystal-trail-5.html": {"base": "https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/", "attrs": " class=\"crystal-game-page lumi-trail\" data-adventure=\"trail\" data-step=\"5\"", "body": "\n\n\n<main class=\"crystal-game-screen sorting-page-screen\">\n\n\n    \n\n    <div class=\"crystal-game-top\">\n\n        <a\n            href=\"crystal-trail-4.html\"\n            class=\"crystal-game-back\"\n        >\n            ← Назад\n        <\/a>\n\n\n        <div class=\"crystal-game-number\">\n            5 из 7\n        <\/div>\n\n\n        <div class=\"crystal-game-progress\">\n\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n            <span class=\"completed\"><\/span>\n\n            <span class=\"current\"><\/span>\n\n            <span><\/span>\n            <span><\/span>\n\n        <\/div>\n\n    <\/div>\n\n\n\n    \n\n    <div class=\"crystal-game-title sorting-title\">\n\n        <span>\n            Пятое испытание\n        <\/span>\n\n        <h1>\n            Разложи кристаллы ✦\n        <\/h1>\n\n        <p>\n            Посмотри внимательно на форму и размер.\n        <\/p>\n\n    <\/div>\n\n\n\n    \n\n    <section class=\"sorting-game-area\">\n\n\n        \n\n        <div class=\"sorting-lumi\">\n\n            <img\n                src=\"star-tower/assets/lumi-welcome.png\"\n                alt=\"Луми\"\n            >\n\n        <\/div>\n\n\n\n        \n\n        <div class=\"sorting-stage\">\n\n\n            \n\n            <div class=\"sorting-baskets\">\n\n\n                \n\n                <button\n                    class=\"sorting-basket\"\n                    id=\"roundBasket\"\n                    data-type=\"round\"\n                    aria-label=\"Корзинка для круглых кристаллов\"\n                >\n\n                    <img\n                        src=\"images/basket-round.png\"\n                        alt=\"Круглые\"\n                    >\n\n                    <div\n                        class=\"basket-items\"\n                        id=\"roundBasketItems\"\n                    ><\/div>\n\n                <\/button>\n\n\n\n                \n\n                <button\n                    class=\"sorting-basket\"\n                    id=\"bigBasket\"\n                    data-type=\"big\"\n                    aria-label=\"Корзинка для больших кристаллов\"\n                >\n\n                    <img\n                        src=\"images/basket-big.png\"\n                        alt=\"Большие\"\n                    >\n\n                    <div\n                        class=\"basket-items\"\n                        id=\"bigBasketItems\"\n                    ><\/div>\n\n                <\/button>\n\n\n            <\/div>\n\n\n\n            \n\n            <div\n                class=\"sorting-message\"\n                id=\"sortingMessage\"\n            >\n                Выбери кристалл ✦\n            <\/div>\n\n\n\n            \n\n            <div\n                class=\"sorting-crystals\"\n                id=\"sortingCrystals\"\n            >\n\n\n                <button\n                    class=\"sorting-crystal\"\n                    data-type=\"round\"\n                    draggable=\"true\"\n                >\n                    <img\n                        src=\"images/crystal-round-1.png\"\n                        alt=\"Круглый кристалл\"\n                    >\n                <\/button>\n\n\n                <button\n                    class=\"sorting-crystal\"\n                    data-type=\"big\"\n                    draggable=\"true\"\n                >\n                    <img\n                        src=\"images/crystal-big-1.png\"\n                        alt=\"Большой кристалл\"\n                    >\n                <\/button>\n\n\n                <button\n                    class=\"sorting-crystal\"\n                    data-type=\"round\"\n                    draggable=\"true\"\n                >\n                    <img\n                        src=\"images/crystal-round-2.png\"\n                        alt=\"Круглый кристалл\"\n                    >\n                <\/button>\n\n\n                <button\n                    class=\"sorting-crystal\"\n                    data-type=\"big\"\n                    draggable=\"true\"\n                >\n                    <img\n                        src=\"images/crystal-big-2.png\"\n                        alt=\"Большой кристалл\"\n                    >\n                <\/button>\n\n\n                <button\n                    class=\"sorting-crystal\"\n                    data-type=\"round\"\n                    draggable=\"true\"\n                >\n                    <img\n                        src=\"images/crystal-round-3.png\"\n                        alt=\"Круглый кристалл\"\n                    >\n                <\/button>\n\n\n                <button\n                    class=\"sorting-crystal\"\n                    data-type=\"big\"\n                    draggable=\"true\"\n                >\n                    <img\n                        src=\"images/crystal-big-3.png\"\n                        alt=\"Большой кристалл\"\n                    >\n                <\/button>\n\n\n            <\/div>\n\n\n            <p class=\"sorting-instruction\">\n                Перетаскивай кристаллы в подходящие корзинки.\n            <\/p>\n\n\n        <\/div>\n\n\n    <\/section>\n\n\n\n    \n\n    <div\n        class=\"crystal-success\"\n        id=\"sortingSuccess\"\n    >\n\n        <div class=\"crystal-success-message\">\n\n            <span>✦<\/span>\n\n            <div>\n\n                <strong>\n                    Всё правильно!\n                <\/strong>\n\n                <p>\n                    Кристаллы разложены по своим местам.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n\n        <button\n            class=\"crystal-next-button\"\n            id=\"nextTask\"\n        >\n            Дальше →\n        <\/button>\n\n    <\/div>\n\n\n<\/main>\n\n\n\n<script>\n\nconst crystals =\n    document.querySelectorAll(\".sorting-crystal\");\n\nconst baskets =\n    document.querySelectorAll(\".sorting-basket\");\n\nconst message =\n    document.getElementById(\"sortingMessage\");\n\nconst success =\n    document.getElementById(\"sortingSuccess\");\n\nconst nextTask =\n    document.getElementById(\"nextTask\");\n\nconst progressCurrent =\n    document.querySelector(\n        \".crystal-game-progress .current\"\n    );\n\n\nlet selectedCrystal = null;\n\nlet draggedCrystal = null;\n\nlet sortedCount = 0;\n\n\n\n/* ==========================================\n   ПЕРЕМЕШИВАЕМ КРИСТАЛЛЫ\n========================================== */\n\nconst crystalContainer =\n    document.getElementById(\"sortingCrystals\");\n\nconst crystalArray =\n    Array.from(crystals);\n\ncrystalArray\n    .sort(() => Math.random() - 0.5)\n    .forEach(crystal => {\n\n        crystalContainer.appendChild(crystal);\n\n    });\n\n\n\n/* ==========================================\n   ВЫБОР НАЖАТИЕМ\n========================================== */\n\ncrystals.forEach(crystal => {\n\n    crystal.addEventListener(\"click\", () => {\n\n\n        if (\n            crystal.classList.contains(\"sorted\")\n        ) {\n            return;\n        }\n\n\n        crystals.forEach(item => {\n\n            item.classList.remove(\"selected\");\n\n        });\n\n\n        crystal.classList.add(\"selected\");\n\n        selectedCrystal = crystal;\n\n\n        message.textContent =\n            \"Теперь выбери подходящую корзинку ✦\";\n\n        message.classList.add(\"show\");\n\n    });\n\n});\n\n\n\n/* ==========================================\n   НАЖАТИЕ НА КОРЗИНКУ\n========================================== */\n\nbaskets.forEach(basket => {\n\n    basket.addEventListener(\"click\", () => {\n\n        if (!selectedCrystal) {\n            return;\n        }\n\n\n        trySortCrystal(\n            selectedCrystal,\n            basket\n        );\n\n    });\n\n});\n\n\n\n/* ==========================================\n   ПЕРЕТАСКИВАНИЕ НА КОМПЬЮТЕРЕ\n========================================== */\n\ncrystals.forEach(crystal => {\n\n\n    crystal.addEventListener(\n        \"dragstart\",\n        event => {\n\n            draggedCrystal = crystal;\n\n            crystal.classList.add(\n                \"dragging\"\n            );\n\n            event.dataTransfer.effectAllowed =\n                \"move\";\n\n        }\n    );\n\n\n    crystal.addEventListener(\n        \"dragend\",\n        () => {\n\n            crystal.classList.remove(\n                \"dragging\"\n            );\n\n            draggedCrystal = null;\n\n        }\n    );\n\n});\n\n\n\nbaskets.forEach(basket => {\n\n\n    basket.addEventListener(\n        \"dragover\",\n        event => {\n\n            event.preventDefault();\n\n            basket.classList.add(\n                \"drag-over\"\n            );\n\n        }\n    );\n\n\n    basket.addEventListener(\n        \"dragleave\",\n        () => {\n\n            basket.classList.remove(\n                \"drag-over\"\n            );\n\n        }\n    );\n\n\n    basket.addEventListener(\n        \"drop\",\n        event => {\n\n            event.preventDefault();\n\n            basket.classList.remove(\n                \"drag-over\"\n            );\n\n\n            if (!draggedCrystal) {\n                return;\n            }\n\n\n            trySortCrystal(\n                draggedCrystal,\n                basket\n            );\n\n        }\n    );\n\n});\n\n\n\n/* ==========================================\n   ПРОВЕРКА\n========================================== */\n\nfunction trySortCrystal(\n    crystal,\n    basket\n) {\n\n    const crystalType =\n        crystal.dataset.type;\n\n    const basketType =\n        basket.dataset.type;\n\n\n\n    /* ПРАВИЛЬНО */\n\n    if (crystalType === basketType) {\n\n\n        basket.classList.remove(\n            \"wrong\"\n        );\n\n\n        basket.classList.add(\n            \"correct\"\n        );\n\n\n        setTimeout(() => {\n\n            basket.classList.remove(\n                \"correct\"\n            );\n\n        }, 450);\n\n\n\n        /* Копируем картинку в корзинку */\n\n        const img =\n            document.createElement(\"img\");\n\n        img.src =\n            crystal.querySelector(\"img\").src;\n\n        img.alt = \"\";\n\n\n\n        if (basketType === \"round\") {\n\n            document\n                .getElementById(\n                    \"roundBasketItems\"\n                )\n                .appendChild(img);\n\n        }\n\n        else {\n\n            document\n                .getElementById(\n                    \"bigBasketItems\"\n                )\n                .appendChild(img);\n\n        }\n\n\n\n        crystal.classList.add(\n            \"sorted\"\n        );\n\n\n        crystal.classList.remove(\n            \"selected\"\n        );\n\n\n        crystal.disabled = true;\n\n\n        selectedCrystal = null;\n\n        sortedCount++;\n\n\n        message.textContent =\n            \"Правильно! ✦\";\n\n        message.classList.add(\"show\");\n\n\n\n        checkFinished();\n\n        return;\n\n    }\n\n\n\n    /* НЕПРАВИЛЬНО */\n\n    basket.classList.remove(\"wrong\");\n\n    void basket.offsetWidth;\n\n    basket.classList.add(\"wrong\");\n\n\n    message.textContent =\n        \"Попробуй другую корзинку ✦\";\n\n    message.classList.add(\"show\");\n\n}\nfunction checkFinished() {\n\n    if (sortedCount !== 6) {\n        return;\n    }\n\n\n    message.textContent =\n        \"Все кристаллы на своих местах! ✦\";\n\n\n    progressCurrent.classList.remove(\n        \"current\"\n    );\n\n    progressCurrent.classList.add(\n        \"completed\"\n    );\n\n\n    setTimeout(() => {\n\n        success.classList.add(\"show\");\n\n    }, 500);\n\n}\n\n\n\n/* ==========================================\n   ЗАДАНИЕ 6\n========================================== */\n\nnextTask.addEventListener(\n    \"click\",\n    () => {\n\n        parent.postMessage({type:'lumi-review',page:\"crystal-trail-6.html\"},'*');\n\n    }\n);\n\n<\/script>\n\n\n", "styles": ["style.css", "adventure-art/illustrated.css"], "scripts": ["help", "nav"]}, "crystal-trail.html": {"base": "https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/", "attrs": " class=\"quest-page lumi-trail\" data-adventure=\"trail\" data-step=\"intro\"", "body": "\n\n<main class=\"quest-intro\">\n\n    <div class=\"quest-intro-top\">\n\n        <a href=\"crystal-world.html#age-3-4\" class=\"quest-home\">\n            ← Назад\n        <\/a>\n\n        <div class=\"quest-world-name\">\n            ✦ Кристальный мир · 3–4 года\n        <\/div>\n\n        <div class=\"quest-progress\">\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"quest-intro-content\">\n\n        <div class=\"quest-story\">\n\n            <span class=\"quest-story-label\">\n                Первое приключение\n            <\/span>\n\n            <h1>\n                Секрет<br>\n                Кристальной тропы\n                <span>✦<\/span>\n            <\/h1>\n\n            <p>\n                Вместе с Луми пройди волшебную тропу,\n                выполни семь испытаний и открой\n                древнюю кристальную дверь.\n            <\/p>\n\n            <button class=\"quest-start-button\" id=\"startQuest\">\n                Начать приключение →\n            <\/button>\n\n        <\/div>\n\n\n        <div class=\"quest-lumi\">\n            <img src=\"star-tower/assets/lumi-welcome.png\" alt=\"Луми\">\n        <\/div>\n\n    <\/div>\n\n<\/main>\n\n\n<script>\nconst startQuest = document.getElementById(\"startQuest\");\n\nstartQuest.addEventListener(\"click\", () => {\n    parent.postMessage({type:'lumi-review',page:\"crystal-trail-1.html\"},'*');\n});\n<\/script>\n\n", "styles": ["style.css", "adventure-art/illustrated.css"], "scripts": ["help", "nav"]}, "crystal-trail-2.html": {"base": "https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/", "attrs": " class=\"crystal-game-page lumi-trail\" data-adventure=\"trail\" data-step=\"2\"", "body": "\n\n\n<main class=\"crystal-game-screen\">\n\n\n    \n\n    <div class=\"crystal-game-top\">\n\n        <a\n            href=\"crystal-trail-1.html\"\n            class=\"crystal-game-back\"\n        >\n            ← Назад\n        <\/a>\n\n\n        <div class=\"crystal-game-number\">\n            2 из 7\n        <\/div>\n\n\n        <div class=\"crystal-game-progress\">\n\n            <span class=\"completed\"><\/span>\n            <span class=\"current\"><\/span>\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n            <span><\/span>\n\n        <\/div>\n\n    <\/div>\n\n\n\n    \n\n    <div class=\"crystal-game-title task2-title\">\n\n        <span>\n            Второе испытание\n        <\/span>\n\n        <h1>\n            Найди кристалл, который отличается ✦\n        <\/h1>\n\n        <p>\n            Посмотри внимательно.\n            У одного кристалла есть маленькое отличие.\n        <\/p>\n\n    <\/div>\n\n\n\n    \n\n    <section class=\"task2-game-area\">\n\n\n        \n\n        <div class=\"task2-lumi\">\n\n            <img\n                src=\"star-tower/assets/lumi-thinking.png\"\n                alt=\"Луми\"\n            >\n\n        <\/div>\n\n\n\n        \n\n        <div class=\"task2-stage\">\n\n            <div\n t\"\n    >\n        Посмотри ещё внимательнее ✦\n    <\/div>\n\n\n\n    \n\n    <div\n        class=\"crystal-success\"\n        id=\"task2Success\"\n    >\n\n        <div class=\"crystal-success-message\">\n\n            <span>✦<\/span>\n\n            <div>\n\n                <strong>\n                    Нашёл!\n                <\/strong>\n\n                <p>\n                    У этого кристалла нет второго маленького осколка.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n\n        <button\n            class=\"crystal-next-button\"\n            id=\"nextTask\"\n        >\n            Дальше →\n        <\/button>\n\n    <\/div>\n\n\n<\/main>\n\n\n\n<script>\n\nconst options =\n    document.querySelectorAll(\".task2-crystal\");\n\nconst optionsContainer =\n    document.getElementById(\"task2Options\");\n\nconst hint =\n    document.getElementById(\"task2Hint\");\n\nconst success =\n    document.getElementById(\"task2Success\");\n\nconst nextTask =\n    document.getElementById(\"nextTask\");\n\nconst progressCurrent =\n    document.querySelector(\n        \".crystal-game-progress .current\"\n    );\n\nlet taskFinished = false;\n\n\n\n/* ПЕРЕМЕШИВАЕМ КРИСТАЛЛЫ */\n\nconst shuffled =\n    Array.from(options);\n\nshuffled\n    .sort(() => Math.random() - 0.5)\n    .forEach(option => {\n\n        optionsContainer.appendChild(option);\n\n    });\n\n\n\n/* ПРОВЕРЯЕМ ОТВЕТ */\n\noptions.forEach(option => {\n\n    option.addEventListener(\"click\", () => {\n\n        if (taskFinished) {\n            return;\n        }\n\n\n        const isCorrect =\n            option.dataset.correct === \"true\";\n\n\n        /* НЕПРАВИЛЬНО */\n\n        if (!isCorrect) {\n\n            option.classList.remove(\"wrong\");\n\n            void option.offsetWidth;\n\n            option.classList.add(\"wrong\");\n\n\n            hint.classList.add(\"show\");\n\n\n            setTimeout(() => {\n\n                hint.classList.remove(\"show\");\n\n            }, 1200); stal-success\"\n        id=\"crystalSuccess\"\n    >\n\n        <div class=\"crystal-success-message\">\n\n            <span>✦<\/span>\n\n            <div>\n                <strong>\n                    Получилось!\n                <\/strong>\n\n                <p>\n                    Три кристалла сияют.\n                    Путь открыт!\n                <\/p>\n            <\/div>\n\n        <\/div>\n\n\n        <button\n            class=\"crystal-next-button\"\n            id=\"nextTask\"\n        >\n            Дальше →\n        <\/button>\n\n    <\/div>\n\n\n<\/main>\n\n\n\n<script>\n\nconst crystals =\n    document.querySelectorAll(\".crystal-button\");\n\nconst success =\n    document.getElementById(\"crystalSuccess\");\n\nconst nextTask =\n    document.getElementById(\"nextTask\");\n\nlet selectedCrystals = 0;\nlet taskFinished = false;\n\n\ncrystals.forEach(crystal => {\n\n    crystal.addEventListener(\"click\", () => {\n\n        if (taskFinished) {\n            return;\n        }\n\n\n        const image =\n            crystal.querySelector(\"img\");\n\n\n        /* Если кристалл уже выбран —\n           можно его снова выключить */\n\n        if (crystal.classList.contains(\"is-lit\")) {\n\n            crystal.classList.remove(\"is-lit\");\n\n            image.src =\n                \"images/crystal-off.png\";\n\n            selectedCrystals--;\n\n            return;\n        }\n\n\n        /* Включаем новый кристалл */\n\n        crystal.classList.add(\"is-lit\");\n\n        image.src =\n            \"images/crystal-on.png\";\n\n        selectedCrystals++;\n\n\n\n        /* Выбрано ровно три */\n\n        if (selectedCrystals === 3) {\n\n            taskFinished = true;\n\n\n            crystals.forEach(item => {\n                item.classList.add(\"task-complete\");\n            });\n\n\n            setTimeout(() => {\n\n                success.classList.add(\"show\");\n\n            }, 500);\n\n        }\n\n    });\n\n});\n\n\n/* Второе задание сделаем следующим шагом */\n\nnextTask.addEventListener(\"click\", () => {\n\n    parent.postMessage({type:'lumi-review',page:\"crystal-trail-2.html\"},'*');\n\n});\n\n<\/script>\n\n\n", "styles": ["style.css", "adventure-art/illustrated.css"], "scripts": ["help", "nav"]}, "crystal-lighthouse/index.html": {"base": "https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/crystal-lighthouse/", "attrs": " class=\"lumi-lighthouse\" data-adventure=\"lighthouse\"", "body": "<div class=\"ambient\" aria-hidden=\"true\"><\/div><div class=\"app\"><header class=\"topbar\"><a class=\"world-back\" href=\"../crystal-world.html#age-4-5\" aria-label=\"Вернуться в Кристальный мир\">← Назад<\/a><span class=\"age\">✦ Кристальный мир · 4–5 лет<\/span><button class=\"sound\" id=\"sound\" aria-label=\"Выключить звуковые эффекты\" aria-pressed=\"true\">♫ <span>Звук<\/span><\/button><\/header><nav class=\"progress\" id=\"progress\" aria-label=\"Задания приключения\"><\/nav><main id=\"main\"><\/main><footer>Маленькие шаги — большие открытия <span>✦<\/span><\/footer><\/div><div id=\"live\" class=\"sr-only\" aria-live=\"polite\"><\/div>", "styles": ["crystal-lighthouse/lighthouse.css", "crystal-lighthouse/storybook.css", "adventure-art/illustrated.css"], "scripts": ["crystal-lighthouse/lighthouse.js", "help", "nav"]}, "star-tower/index.html": {"base": "https://raw.githubusercontent.com/angelina14sitnikova-web/lumi-website/lumi/illustrated-all-ages/star-tower/", "attrs": " class=\"lumi-star\"", "body": "\n<div class=\"shell\"><header class=\"topbar\"><a class=\"icon\" href=\"../crystal-world.html#age-5-6\" aria-label=\"В главное меню\">⌂<\/a><div id=\"progress\" aria-label=\"Собрано звёзд\"><\/div><button id=\"sound\" class=\"icon\" aria-label=\"Включить звук\">Звук: выкл.<\/button><\/header><div class=\"helpbar\"><button id=\"hint-toggle\" class=\"hint-button\" aria-expanded=\"false\" aria-controls=\"hint-panel\">Подсказка<\/button><\/div><aside id=\"hint-   Волшебная долина загадок, сияющих кристаллов\n            и маленьких открытий.\n        <\/p>\n\n    <\/div>\n\n<\/section>\n\n\n<section class=\"crystal-age-section\">\n\n    <p class=\"crystal-age-title\">\n        Выбери свой возраст\n    <\/p>\n\n    <div class=\"crystal-age-buttons\">\n\n        <button class=\"active-age\" data-age=\"age-3-4\">\n            3–4 года\n        <\/button>\n\n        <button data-age=\"age-4-5\">\n            4–5 лет\n        <\/button>\n\n        <button data-age=\"age-5-6\">\n            5–6 лет\n        <\/button>\n\n        <button data-age=\"age-6-7\">\n            6–7 лет\n        <\/button>\n\n    <\/div>\n\n<\/section>\n\n\n<section class=\"crystal-adventures\">\n\n    \n\n    <div class=\"age-adventures active-adventures\" id=\"age-3-4\">\n\n        <div class=\"crystal-section-heading\">\n            <span>3–4 года<\/span>\n            <h2>Выбери приключение ✦<\/h2>\n            <p>\n                Короткие игровые истории для первых открытий.\n            <\/p>\n        <\/div>\n\n\n        <div class=\"crystal-adventure-grid\">\n\n            <article class=\"crystal-quest featured-quest illustrated-quest\">\n                <img class=\"quest-cover\" src=\"images/crystal-trail-bg.png\" alt=\"Волшебная Кристальная тропа\" loading=\"lazy\">\n\n                <div class=\"quest-number\">\n                    Приключение 01\n                <\/div>\n\n                <div class=\"quest-content\">\n\n                    <span class=\"quest-type\">\n                        ✦ 7 испытаний\n                    <\/span>\n\n                    <h3>\n                        Секрет Кристальной тропы\n                    <\/h3>\n\n                    <p>\n                        Помоги Луми пройти волшебную тропу,\n                        решить семь загадок и открыть древнюю дверь.\n                    <\/p>\n\n                    <div class=\"quest-skills\">\n                        <span>Счёт<\/span>\n                        <span>Логика<\/span>\n                        <span>Внимание<\/span>\n                    <\/div>\n\n                    <a href=\"crystal-trail.html\" class=\"quest-button\">\n                        Начать приключение →\n                    <\/a>\n\n                <\/div>\n\n            <\/article>\n\n\n            <article class=\"crystal-quest\">\n\n                <div class=\"quest-number\">\n                    Приключение 02\n                <\/div>\n\n                <div class=\"quest-content\">\n\n                    <span class=\"quest-type\">\n                        Скоро\n                    <\/span>\n\n                    <h3>\n                        Звёзды в пещере\n                    <\/h3>\n\n                    <p>\n                        Найди пропавшие огоньки и помоги\n                        маленьким звёздам вернуться домой.\n                    <\/p>\n\n                    <div class=\"quest-skills\">\n                        <span>Память<\/span>\n                        <span>Счёт<\/span>\n                    <\/div>\n\n                    <span class=\"quest-soon\">\n                        В разработке ✦\n                    <\/span>\n\n                <\/div>\n\n            <\/article>\n\n\n            <article class=\"crystal-quest\">\n\n                <div class=\"quest-number\">\n                    Приключение 03\n                <\/div>\n\n                <div class=\"quest-content\">\n\n                    <span class=\"quest-type\">\n                        Скоро\n                    <\/span>\n\n                    <h3>\n                        Мост светлячков\n                    <\/h3>\n\n                    <p>\n                        Помоги светлячкам восстановить\n                        дорогу через волшебную реку.\n                    <\/p>\n\n                    <div class=\"quest-skills\">\n                        <span>Формы<\/span>\n                        <span>Сравнение<\/span>\n                    <\/div>\n\n                    <span class=\"quest-soon\">\n                        В разработке ✦\n                    <\/span>\n\n                <\/div>\n\n            <\/article>\n\n        <\/div>\n\n    <\/div>\n\n\n    \n    <div class=\"age-adventures\" id=\"age-4-5\">\n        <div class=\"crystal-section-heading\">\n            <span>4–5 лет<\/span>\n            <h2>Выбери приключение ✦<\/h2>\n            <p>Волшебные истории и новые открытия вместе с Луми.<\/p>\n        <\/div>\n        <div class=\"crystal-adventure-grid\">\n            <article class=\"crystal-quest featured-quest illustrated-quest\">\n                <img class=\"quest-cover\" src=\"adventure-art/lighthouse-coast.png\" alt=\"Кристальный маяк над морем на закате\" loading=\"lazy\">\n                <div class=\"quest-number\">Приключение 01<\/div>\n                <div class=\"quest-content\">\n                    <span class=\"quest-type\">✦ 7 испытаний<\/span>\n                    <h3>Тайна Кристального маяка<\/h3>\n                    <p>Помоги Луми пройти семь испытаний и вернуть свет волшебному маяку.<\/p>\n                    <div class=\"quest-skills\"><span>Логика<\/span><span>Сравнение<\/span><span>Память<\/span><\/div>\n                    <a href=\"crystal-lighthouse/index.html\" class=\"quest-button\">Начать приключение →<\/a>\n                <\/div>\n            <\/article>\n        <\/div>\n    <\/div>\n\n    \n    <div class=\"age-adventures\" id=\"age-5-6\">\n        <div class=\"crystal-section-heading\">\n            <span>5–6 лет<\/span>\n            <h2>Выбери приключение ✦<\/h2>\n            <p>Звёздные загадки, волшебные механизмы и новые открытия.<\/p>\n        <\/div>\n        <div class=\"crystal-adventure-grid\">\n            <article class=\"crystal-quest featured-quest star-tower-card illustrated-quest\">\n                <img class=\"star-tower-cover quest-cover\" src=\"star-tower/assets/tower-night.png\" alt=\"Волшебная Звёздная башня над облаками\" loading=\"lazy\">\n                <div class=\"quest-number\">Приключение 01<\/div>\n                <div class=\"quest-content\">\n                    <span class=\"quest-type\">✦ 7 испытаний · 5–6 лет<\/span>\n                    <h3>Луми и Тайна Звёздной башни<\/h3>\n                    <p>Верни семь исчезнувших звёзд, восстанови небесную карту и зажги башню вместе с Луми.<\/p>\n                    <div class=\"quest-skills\"><span>Логика<\/span><span>Память<\/span><span>Счёт<\/span><span>Воображение<\/span><\/div>\n                    <a href=\"star-tower/index.html\" class=\"quest-button\">Начать приключение →<\/a>\n                <\/div>\n            <\/article>\n        <\/div>\n    <\/div>\n\n    \n\n    <div class=\"age-adventures\" id=\"age-6-7\">\n\n        <div class=\"crystal-section-heading\">\n            <span>6–7 лет<\/span>\n            <h2>Новые приключения готовятся ✦<\/h2>\n            <p>\n                Здесь появятся игровые задания\n                для подготовки к школе.\n            <\/p>\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n<\/main>\n\n\n<footer>\n    <p>Луми — мир маленьких открытий ✦<\/p>\n<\/footer>\n\n\n<script>\n\nconst crystalAgeButtons =\n    document.querySelectorAll(\".crystal-age-buttons button\");\n\nconst crystalAgeSections =\n    document.querySelectorAll(\".age-adventures\");\n\n\ncrystalAgeButtons.forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n        crystalAgeButtons.forEach(btn => {\n            btn.classList.remove(\"active-age\");\n        });\n\n        crystalAgeSections.forEach(section => {\n            section.classList.remove(\"active-adventures\");\n        });\n\n        button.classList.add(\"active-age\");\n\n        const target =\n            document.getElementById(button.dataset.age);\n\n        target.classList.add(\"active-adventures\");\n        history.replaceState(null, \"\", \"#\" + button.dataset.age);\n\n    });\n\n});\n\nfunction restoreCrystalAge() {\n    const selected = Array.from(crystalAgeButtons).find(\n        button => \"#\" + button.dataset.age === location.hash\n    );\n    if (selected) selected.click();\n}\nrestoreCrystalAge();\nwindow.addEventListener(\"hashchange\", restoreCrystalAge);\n\n<\/script>\n\n", "styles": ["style.css", "star-tower/card.css", "adventure-art/cards.css"], "scripts": ["nav"]}}, "css": {"style.css": "* { box-sizing: border-box; } html { scroll-behavior: smooth; } body { margin: 0; font-family: \"Trebuchet MS\", Arial, sans-serif; color: #34265f; background: linear-gradient( 180deg, #e8e5ff 0%, #f9efff 55%, #fff6eb 100% ); } .header { max-width: 1280px; margin: 18px auto 0; padding: 14px 35px; display: flex; align-items: center; justify-content: space-between; gap: 20px; background: rgba(255,255,255,.88); border: 1px solid white; border-radius: 40px; box-shadow: 0 8px 25px #7660a52b; position: relative; z-index: 2; } .logo { font-size: 38px; font-weight: 900; color: #67449d; text-decoration: none; } .logo span { color: #f1b92d; font-size: 23px; } .navigation { display: flex; align-items: center; gap: 18px; } .navigation a { padding: 12px 18px; text-decoration: none; color: #34265f; font-weight: bold; border-radius: 30px; } .navigation a:hover, .navigation .active { background: #e9d9ff; color: #67449d; } .header-icons { display: flex; gap: 10px; } .header-icons button { border: none; background: #e9d9ff; color: #67449d; border-radius: 50%; width: 43px; height: 43px; font-size: 26px; cursor: pointer; } .hero { max-width: 1280px; min-height: 460px; margin: 0 auto; padding: 65px 75px; display: flex; align-items: center; justify-content: space-between; gap: 30px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 85% 80%, #d7e5c4 0%, transparent 35%), radial-gradient(ellipse at 30% 95%, #fff3d8 0%, transparent 45%), linear-gradient(135deg, #f9f0ff, #dcdfff); } .hero-text { flex: 1; position: relative; z-index: 1; } .hero h1 { font-size: clamp(36px, 4.5vw, 65px); line-height: 1. кроется.',2:'Сравни маленькие осколки у основания каждого кристалла. У обычных кристаллов их два. Найди тот, у которого одного осколка не хватает.',3:'Посмотри на края пустого места в мосту. Сравни их с краями трёх кусочков. Нужен кусочек такой формы, чтобы он заполнил отверстие.',4:'Сначала сосчитай все огоньки рядом со светлячком. Затем добавляй ягодки по одной, пока ягод и огоньков не станет одинаково. Нажми «Далее».',5:'Нажми на кристалл, затем на нужную корзинку. В одну собирай круглые кристаллы, в другую — большие вытянутые. Картинки корзинок помогут сравнить форму.',6:'Читай узор слева направо и называй картинки: кристалл, звёздочка, кристалл, звёздочка. Какая картинка повторится следующей? Выбери её внизу.',7:'Ключ должен подходить сразу по двум признакам: круглое колечко и звезда. Сначала найди ключи с круглым колечком, затем среди них выбери тот, на котором звезда.',reward:'Все семь испытаний пройдены! Твой Кристалл открытий уже найден. Кнопка внизу вернёт тебя в Кристальный мир к возрасту 3–4 года.'};\nconst lighthouseHints={intro:'Нажми «Начать приключение». Если ты уже играл, кнопка «Продолжить» вернёт к следующему заданию. Ошибаться можно: за верный ответ Луми похвалит тебя, а задание можно попробовать ещё раз.',1:'Начни с первого камня и сравни всю дорожку с образцом: кристалл → звезда → луна. Этот порядок должен повторяться до самого конца. Все пути ведут на другой берег, но правило соблюдает только один.',2:'Выбери кристалл, затем найди ему точно такой же. Сравни сразу три признака: цвет, форму и значок внутри. Найденная пара подсветится и больше не будет выбираться, а разные кристаллы можно выбрать заново.',3:'Начни с самой широкой плитки и поставь её на нижнее место. Следующую, чуть уже, поставь выше. Так построй все пять ступенек. Нажми «Проверить», когда лестница готова.',4:'Посчитай светлячков на левой полянке — это образец. Справа должно стать ровно столько же. Сначала добавляй светлячков из запаса, а во второй части убирай лишних с правой пол
