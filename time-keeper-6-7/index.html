<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211b48">
  <meta name="description" content="Семь речевых испытаний, волшебная башня и часы для детей 6–7 лет">
  <title>Луми и Повелитель времени</title>
  <link rel="stylesheet" href="time.css">
  <script defer src="../analytics/lumi-analytics.js?v=time-keeper-1"></script>
  <script defer src="content.js"></script>
  <script defer src="speech-map.js"></script>
  <script defer src="sound.js"></script>
  <script defer src="tiles.js"></script>
  <script defer src="view.js"></script>
  <script defer src="game.js"></script>
</head>
<body data-scene="start">
  <header class="time-top">
    <a class="quiet exit" href="../crystal-world.html#age-6-7">В каталог</a>
    <div class="audio-buttons" aria-label="Управление звуком">
      <button id="voice" class="quiet" type="button" aria-pressed="true">Голос: вкл.</button>
      <button id="music-toggle" class="quiet" type="button" aria-pressed="false">Музыка: выкл.</button>
    </div>
  </header>
  <main id="game" tabindex="-1"></main>
  <p id="sound-status" role="status"></p>
  <footer data-lumi-analytics-footer></footer>
  <dialog id="reward" aria-labelledby="reward-title">
    <div class="reward-content">
      <h2 id="reward-title">ПРАВИЛЬНО!</h2>
      <div class="reward-art">
        <img src="assets/lumi/finish.png" alt="Луми радуется">
        <img id="reward-gear" src="assets/rewards/gear-1.webp" alt="Золотая шестерёнка">
      </div>
      <p>Ты нашёл золотую шестерёнку!</p>
      <button id="next-task" type="button">Дальше</button>
    </div>
  </dialog>
  <audio id="narration" preload="none" playsinline></audio>
  <audio id="music" preload="none" loop playsinline src="audio/music.mp3"></audio>
  <audio id="chime" preload="none" playsinline></audio>
</body>
</html>
